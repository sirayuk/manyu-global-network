{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold text-manyuGreen mb-6">Manyang Global Marketplace & Talent Hub</h1>
    <div class="bg-white p-6 rounded-xl shadow border-t-4 border-manyuGold mb-10">
        <form method="POST" action="/marketplace" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" name="seller_name" required placeholder="Your Name / Business" class="border rounded px-3 py-2 text-sm">
            <input type="text" name="title" required placeholder="Item or Service Title" class="border rounded px-3 py-2 text-sm">
            <select name="category" class="border rounded px-3 py-2 text-sm"><option value="Cultural Attire & Crafts">Cultural Attire & Crafts</option><option value="Agro-Produce">Agro-Produce</option><option value="Professional Services">Professional Services</option><option value="Real Estate & Land">Real Estate & Land</option></select>
            <input type="text" name="price" required placeholder="Price" class="border rounded px-3 py-2 text-sm">
            <input type="text" name="location" required placeholder="Location" class="border rounded px-3 py-2 text-sm">
            <input type="text" name="contact" required placeholder="WhatsApp / Email" class="border rounded px-3 py-2 text-sm">
            <textarea name="description" rows="2" required placeholder="Description..." class="md:col-span-2 border rounded px-3 py-2 text-sm"></textarea>
            <button type="submit" class="bg-manyuGreen text-white font-bold rounded-lg py-2 px-4">Publish Listing</button>
        </form>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% for item in items %}
        <div class="bg-white p-5 rounded-xl shadow border-l-4 border-manyuGold">
            <div class="flex justify-between"><span class="text-xs font-bold bg-green-100 text-manyuGreen px-2 py-0.5 rounded">{{ item.category }}</span><span class="font-extrabold text-manyuGreen text-sm">{{ item.price }}</span></div>
            <h3 class="text-lg font-bold mt-2">{{ item.title }}</h3>
            <p class="text-xs text-gray-500">By {{ item.seller_name }} &bull; {{ item.location }}</p>
            <p class="text-sm text-gray-700 mt-2">{{ item.description }}</p>
            <div class="mt-3 pt-2 border-t text-xs font-bold text-manyuGreen">Contact: {{ item.contact }}</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
